name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r frontend/requirements.txt -r requirements-dev.txt

      - name: Prepare runtime directories
        run: |
          mkdir -p data/chromadb data/uploads data/logs data/cache data/embeddings data/temp data/models data/ollama models

      - name: Compile Python modules
        run: |
          python -m compileall -q backend frontend examples/retail_analytics

      - name: Validate Docker Compose
        run: |
          docker compose --env-file docker/.env.production config --quiet

      - name: Run tests and coverage gate
        run: |
          python -m pytest -q --cov=backend --cov=frontend --cov-report=term-missing --cov-fail-under=85
